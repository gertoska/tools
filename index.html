<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tools — small, free utilities that run in your browser</title>
    <meta
      name="description"
      content="A growing set of free web tools with no sign-up and no uploads. Everything runs in your browser: what you type never leaves the page."
    />
    <link rel="canonical" href="https://gertoska.com/" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script type="module" src="/src/hub/main.ts"></script>
  </head>
  <body>
    <!--@shared header brandKey="app.name" brand="Tools"-->

    <main id="main">
      <p class="tagline" data-i18n="app.tagline">
        Small, free utilities that run entirely in your browser. No accounts and no uploads.
      </p>
      <h2 class="visually-hidden" data-i18n="hub.list">All tools</h2>
      <ul class="tool-grid">
        <li>
          <a class="tool-card" href="/slugify/">
            <span class="tool-name" data-i18n="tool.slugify.name">Slugify</span>
            <span class="tool-desc" data-i18n="tool.slugify.desc"
              >Turn any title into a clean URL slug, one at a time or in bulk.</span
            >
          </a>
        </li>
      </ul>
    </main>

    <!--@shared footer-->
  </body>
</html>
