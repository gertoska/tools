<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to the content</a>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">/</span>
    <h1 data-i18n="{{brandKey}}">{{brand}}</h1>
  </div>
  <div class="header-actions">
    <div
      class="lang-switcher"
      role="group"
      data-i18n-aria-label="lang.switcher"
      aria-label="Interface language"
    >
      <button type="button" class="lang-button" data-locale="en" lang="en" aria-pressed="true">
        EN
      </button>
      <button type="button" class="lang-button" data-locale="es" lang="es" aria-pressed="false">
        ES
      </button>
      <button type="button" class="lang-button" data-locale="ca" lang="ca" aria-pressed="false">
        CA
      </button>
    </div>
    <button
      type="button"
      id="theme-toggle"
      class="icon-button"
      data-i18n-aria-label="theme.toggle"
      aria-label="Switch between light and dark"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path
          class="icon-sun"
          fill="currentColor"
          d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1ZM3 11h2a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Zm16 0h2a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2ZM5.6 4.2l1.4 1.4a1 1 0 0 1-1.4 1.4L4.2 5.6a1 1 0 0 1 1.4-1.4Zm12.8 12.8 1.4 1.4a1 1 0 0 1-1.4 1.4L17 18.4a1 1 0 0 1 1.4-1.4ZM18.4 4.2a1 1 0 0 1 1.4 1.4L18.4 7A1 1 0 0 1 17 5.6Zm-12.8 12.8A1 1 0 0 1 7 18.4l-1.4 1.4a1 1 0 0 1-1.4-1.4Z"
        />
        <path
          class="icon-moon"
          fill="currentColor"
          d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
        />
      </svg>
    </button>
  </div>
</header>
